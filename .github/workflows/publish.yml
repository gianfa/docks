name: CI/CD Pipeline

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11.13"

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "$PYTHON_VERSION"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          poetry --version

      - name: Install dependencies with dev
        run: poetry install -E dev

      - name: Run linters and tests
        run: |
          poetry run black --check .
          poetry run pytest

      - name: Prepare version bump
        if: github.ref == 'refs/heads/main'
        id: bump_version
        run: |
          # Get the current and new version
          CURRENT_VERSION="$(poetry version -s)"
          poetry version patch
          NEW_VERSION="$(poetry version -s)"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

          # Update __version__ in __init__.py without overwriting the file
          INIT_FILE="docks/__init__.py"
          if grep -q "^__version__" "$INIT_FILE"; then
            # Update the existing __version__ line
            sed -i "s/^__version__ = .*/__version__ = \"$NEW_VERSION\"/" "$INIT_FILE"
          else
            # Add __version__ line if not present
            echo "__version__ = \"$NEW_VERSION\"" >> "$INIT_FILE"
          fi

      - name: Push changes
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add pyproject.toml docks/__init__.py README.md
          git commit -m "Bump version to $NEW_VERSION and update badge"
          git tag v$NEW_VERSION
          git push origin main --tags

      - name: Build package
        run: poetry build && ls dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-artifacts
          path: dist/

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    if: >
      contains(fromJson('[
        "refs/heads/main",
        "refs/heads/develop",
        "refs/heads/feature/pipeline-semantic_release"
      ]'), github.ref)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python (for build)
        uses: actions/setup-python@v5
        with:
          python-version: "$PYTHON_VERSION"

      - name: Install semantic-release + plugins
        run: |
          npm i -g semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/python

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: semantic-release
